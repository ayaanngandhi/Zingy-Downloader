<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zingy — Video Downloader</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="description" content="Download videos from YouTube, Instagram, TikTok, Twitter/X and 1000+ platforms. Free, no ads, no storage — paste a link, pick quality, download instantly.">
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #6200ee;
            --accent-hover: #7c4dff;
            --success: #00c853;
            --error: #cf6679;
            --border: #404040;
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e0e0e0;
            --text-primary: #212121;
            --text-secondary: #666666;
            --accent: #6200ee;
            --accent-hover: #7c4dff;
            --success: #00c853;
            --error: #b00020;
            --border: #cccccc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
        }

        .header { text-align: center; margin-bottom: 32px; }

        .logo {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .subtitle { color: var(--text-secondary); font-size: 16px; }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 4px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 4px;
        }

        .theme-toggle button {
            background: none; border: none;
            color: var(--text-secondary);
            padding: 6px 12px; border-radius: 6px;
            cursor: pointer; font-size: 14px;
            transition: all 0.2s;
        }
        .theme-toggle button.active { background: var(--bg-secondary); color: var(--text-primary); }

        .input-group {
            display: flex; gap: 12px; margin-bottom: 24px;
        }

        .input-group input {
            flex: 1; padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 16px; outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: var(--accent); }
        .input-group input::placeholder { color: var(--text-secondary); }

        button {
            padding: 14px 24px; border: none;
            border-radius: 12px;
            background: var(--accent);
            color: white; font-size: 16px;
            font-weight: 600; cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .loading {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status {
            text-align: center; padding: 10px; border-radius: 8px;
            margin-bottom: 16px; font-size: 14px; display: none;
        }
        .status.error { display: block; background: rgba(207, 102, 121, 0.15); color: var(--error); }
        .status.success { display: block; background: rgba(0, 200, 83, 0.15); color: var(--success); }

        .video-info {
            background: var(--bg-secondary); border-radius: 12px;
            padding: 20px; margin-bottom: 16px;
            display: flex; gap: 16px; align-items: flex-start;
            border: 1px solid var(--border);
        }
        .video-info.hidden { display: none; }
        .video-thumbnail { width: 160px; border-radius: 8px; flex-shrink: 0; }
        .video-thumbnail.hidden { display: none; }
        .video-details { flex: 1; }
        .video-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; word-break: break-word; }

        .platform-badge {
            display: inline-block; padding: 4px 10px; border-radius: 6px;
            font-size: 12px; font-weight: 600; text-transform: capitalize;
        }
        .platform-youtube { background: rgba(255,0,0,0.15); color: #ff4444; }
        .platform-instagram { background: rgba(225,48,108,0.15); color: #e1306c; }
        .platform-tiktok { background: rgba(0,0,0,0.3); color: #fff; }
        .platform-twitter { background: rgba(29,161,242,0.15); color: #1da1f2; }
        .platform-facebook { background: rgba(8,102,255,0.15); color: #0866ff; }
        .platform-reddit { background: rgba(255,69,0,0.15); color: #ff4500; }
        .platform-twitch { background: rgba(145,70,255,0.15); color: #9146ff; }
        .platform-vimeo { background: rgba(26,183,234,0.15); color: #1ab7ea; }
        .platform-soundcloud { background: rgba(255,85,0,0.15); color: #ff5500; }
        .platform-spotify { background: rgba(30,215,96,0.15); color: #1ed760; }
        .platform-bilibili { background: rgba(0,174,236,0.15); color: #00aeec; }
        .platform-dailymotion { background: rgba(0,210,255,0.15); color: #00d2ff; }
        .platform-pinterest { background: rgba(230,0,35,0.15); color: #e60023; }
        .platform-snapchat { background: rgba(255,252,0,0.2); color: #fffc00; }
        .platform-threads { background: rgba(0,0,0,0.3); color: #fff; }
        .platform-unknown { background: rgba(255,255,255,0.1); color: var(--text-secondary); }

        .format-select {
            width: 100%; padding: 12px;
            border: 2px solid var(--border); border-radius: 10px;
            background: var(--bg-tertiary); color: var(--text-primary);
            font-size: 14px; margin-bottom: 12px; outline: none;
        }
        .format-select:focus { border-color: var(--accent); }

        .progress-container { display: none; margin-bottom: 16px; }
        .progress-container.active { display: block; }
        .progress-bar { height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-hover)); border-radius: 4px; width: 0%; transition: width 0.3s; }
        .progress-stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); }

        /* Platforms grid */
        .platforms-section {
            margin-top: 40px;
            text-align: center;
        }
        .platforms-section h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 500;
        }
        .platforms-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .platform-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .platform-chip:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 24px 20px;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 13px;
        }
        .footer a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer a:hover { color: var(--accent-hover); }
        .footer .links {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="theme-toggle">
            <button data-theme="dark" class="active">Dark</button>
            <button data-theme="light">Light</button>
            <button data-theme="auto">Auto</button>
        </div>

        <div class="header">
            <div class="logo">Zingy</div>
            <div class="subtitle">Download videos from YouTube, Instagram, TikTok, Twitter/X & 1000+ more</div>
        </div>

        <div class="input-group">
            <input type="text" id="url-input" placeholder="Paste video URL here...">
            <button id="fetch-btn" onclick="fetchFormats()">Fetch</button>
        </div>

        <div id="status" class="status"></div>

        <div id="video-info" class="video-info hidden">
            <img id="video-thumbnail" class="video-thumbnail hidden" src="" alt="Thumbnail">
            <div class="video-details">
                <div id="video-title" class="video-title"></div>
                <span id="platform-badge" class="platform-badge"></span>
                <br><br>
                <select id="format-select" class="format-select"></select>
                <button id="download-btn" onclick="startDownload()">Download</button>
            </div>
        </div>

        <div id="progress-container" class="progress-container">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div class="progress-stats">
                <span id="progress-percent">0%</span>
                <span id="progress-speed"></span>
            </div>
        </div>

        <!-- Supported Platforms -->
        <div class="platforms-section">
            <h3>Supports 1000+ platforms including</h3>
            <div class="platforms-grid" id="platforms-grid">
                <!-- Filled by JS -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="links">
            <a href="https://github.com/ayaanngandhi/Zingy-Downloader" target="_blank" rel="noopener">GitHub</a>
            <span>·</span>
            <a href="https://ayaanngandhi.in" target="_blank" rel="noopener">ayaanngandhi.in</a>
        </div>
        <div>Video downloads are streamed directly to your browser. Nothing is stored on the server.</div>
    </footer>

    <script>
        // Platform data from server
        const PLATFORMS = {{ platforms | tojson | safe }};

        // Render platform chips
        document.getElementById('platforms-grid').innerHTML = PLATFORMS.map(p =>
            `<span class="platform-chip">${p.icon} ${p.name}</span>`
        ).join('');

        // Theme handling
        let currentTheme = localStorage.getItem('zingy-theme') || 'dark';

        function applyTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('zingy-theme', theme);
            if (theme === 'auto') {
                const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            document.querySelectorAll('.theme-toggle button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
        }

        document.querySelectorAll('.theme-toggle button').forEach(btn => {
            btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
        });
        applyTheme(currentTheme);
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (currentTheme === 'auto') applyTheme('auto');
        });

        // Download flow
        let currentDownloadId = null;

        async function fetchFormats() {
            const url = document.getElementById('url-input').value.trim();
            if (!url) { showStatus('Please enter a URL', 'error'); return; }

            const fetchBtn = document.getElementById('fetch-btn');
            fetchBtn.disabled = true;
            fetchBtn.innerHTML = '<span class="loading"></span>Fetching...';

            try {
                const response = await fetch('/api/formats', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('video-info').classList.remove('hidden');
                    const thumbnail = document.getElementById('video-thumbnail');
                    if (data.thumbnail) {
                        thumbnail.src = data.thumbnail;
                        thumbnail.classList.remove('hidden');
                    } else { thumbnail.classList.add('hidden'); }

                    document.getElementById('video-title').textContent = data.title;

                    const badge = document.getElementById('platform-badge');
                    badge.textContent = data.platform;
                    badge.className = 'platform-badge platform-' + data.platform;

                    const select = document.getElementById('format-select');
                    select.innerHTML = '';
                    data.formats.forEach(format => {
                        const option = document.createElement('option');
                        option.value = format.id;
                        option.textContent = format.label;
                        select.appendChild(option);
                    });
                    hideStatus();
                } else {
                    showStatus(data.error || 'Failed to fetch video info', 'error');
                }
            } catch (error) {
                showStatus('Network error: ' + error.message, 'error');
            } finally {
                fetchBtn.disabled = false;
                fetchBtn.textContent = 'Fetch';
            }
        }

        async function startDownload() {
            const url = document.getElementById('url-input').value.trim();
            const format = document.getElementById('format-select').value;
            const downloadBtn = document.getElementById('download-btn');
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '<span class="loading"></span>Starting...';

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, format })
                });
                const data = await response.json();

                if (data.success) {
                    currentDownloadId = data.download_id;
                    document.getElementById('progress-container').classList.add('active');
                    showStatus('Preparing download...', 'success');
                    pollProgress();
                } else {
                    showStatus(data.error || 'Failed to start download', 'error');
                    downloadBtn.disabled = false;
                    downloadBtn.textContent = 'Download';
                }
            } catch (error) {
                showStatus('Network error: ' + error.message, 'error');
                downloadBtn.disabled = false;
                downloadBtn.textContent = 'Download';
            }
        }

        async function pollProgress() {
            if (!currentDownloadId) return;
            try {
                const response = await fetch('/api/progress/' + currentDownloadId);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('progress-fill').style.width = data.progress + '%';
                    document.getElementById('progress-percent').textContent = data.progress + '%';
                    document.getElementById('progress-speed').textContent = data.speed || '';

                    if (data.status === 'completed') {
                        showStatus('Download ready — saving to your device...', 'success');
                        triggerFileDownload(currentDownloadId);
                        return;
                    } else if (data.status === 'error') {
                        showStatus(data.error || 'Download failed', 'error');
                        resetDownloadUI();
                        return;
                    }
                    setTimeout(pollProgress, 500);
                }
            } catch (error) {
                setTimeout(pollProgress, 1000);
            }
        }

        function triggerFileDownload(downloadId) {
            const a = document.createElement('a');
            a.href = '/api/file/' + downloadId;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            resetDownloadUI();
            showStatus('Download complete!', 'success');
            setTimeout(hideStatus, 3000);
        }

        function resetDownloadUI() {
            currentDownloadId = null;
            document.getElementById('download-btn').disabled = false;
            document.getElementById('download-btn').textContent = 'Download';
            document.getElementById('progress-container').classList.remove('active');
            document.getElementById('progress-fill').style.width = '0%';
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }
        function hideStatus() { document.getElementById('status').className = 'status'; }

        document.getElementById('url-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchFormats();
        });
    </script>
</body>
</html>
